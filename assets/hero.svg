<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">组织协作下的 AI 与工程实践</title>
  <desc id="desc">组织协作连接 AI 实践与前端工程化，并以虚线延伸至全栈探索。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20303c" stroke-opacity=".48" stroke-width=".7"/></pattern>
    <radialGradient id="light" cx="82%" cy="45%" r="65%"><stop stop-color="#123c40" stop-opacity=".7"/><stop offset="1" stop-color="#0c141e" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64f5c4" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1040" height="360" rx="16" fill="#0c141e"/>
  <rect width="1040" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1040" height="360" rx="16" fill="url(#light)"/>
  <rect x=".5" y=".5" width="1039" height="359" rx="15.5" fill="none" stroke="#293b48"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
    <circle cx="43" cy="37" r="4" fill="#64f5c4"/>
    <text x="58" y="42" font-size="12" font-family="monospace" letter-spacing="1.5" fill="#a5b8c9">ORGANIZATION / AI / ENGINEERING</text>
    <text x="40" y="126" font-size="45" font-weight="700" letter-spacing="1" fill="#f0f6fc">组织协作下的</text>
    <text x="40" y="189" font-size="50" font-weight="700" fill="#64f5c4">AI 与工程实践</text>
    <text x="44" y="231" font-size="17" fill="#a5b8c9">前端工程化 · 全栈探索</text>
    <path d="M44 265H530" stroke="#293b48"/>
    <text x="44" y="299" font-size="12" font-family="monospace" letter-spacing="1.2" fill="#8299ae">FRONTEND → FULL STACK</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-anchor="middle">
    <path d="M800 119V143M695 143H905M695 143V169M905 143V169" fill="none" stroke="#477479" stroke-width="1.5"/>
    <path d="M695 225V249H800M905 225V249H800V277" fill="none" stroke="#64f5c4" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <circle cx="800" cy="143" r="3" fill="#64f5c4"/>
    <rect x="716" y="63" width="168" height="56" rx="9" fill="#152833" stroke="#60858b"/>
    <text x="800" y="98" font-size="20" font-weight="600" fill="#f0f6fc">组织协作</text>
    <g font-size="19" font-weight="600">
      <rect x="610" y="169" width="170" height="56" rx="9" fill="#14302e" stroke="#64f5c4"/>
      <text x="695" y="204" fill="#64f5c4">AI 实践</text>
      <rect x="820" y="169" width="170" height="56" rx="9" fill="#152833" stroke="#73bfff"/>
      <text x="905" y="204" fill="#a3d4ff">前端工程化</text>
    </g>
    <rect x="710" y="281" width="180" height="48" rx="9" fill="#101f2a" stroke="#537986" stroke-dasharray="4 4"/>
    <text x="800" y="312" font-size="18" fill="#c1d6e3">全栈探索</text>
