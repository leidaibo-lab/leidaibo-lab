<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Build systems. Grow teams. — 前端工程、团队管理与 AI 实践</title>
  <desc id="desc">深色网格背景上，以工程建设与团队成长为主题，Engineering、Leadership 和 AI 三个节点相连。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20303c" stroke-opacity=".48" stroke-width=".7"/></pattern>
    <radialGradient id="light" cx="82%" cy="45%" r="65%"><stop stop-color="#123c40" stop-opacity=".7"/><stop offset="1" stop-color="#0c141e" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#64f5c4"/><stop offset="1" stop-color="#73bfff"/></linearGradient>
  </defs>
  <rect width="1040" height="360" rx="16" fill="#0c141e"/>
  <rect width="1040" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1040" height="360" rx="16" fill="url(#light)"/>
  <rect x=".5" y=".5" width="1039" height="359" rx="15.5" fill="none" stroke="#293b48"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <circle cx="43" cy="37" r="4" fill="#64f5c4"/>
    <text x="58" y="42" font-size="12" font-family="monospace" letter-spacing="1.5" fill="#a5b8c9">ENGINEERING / LEADERSHIP / AI</text>
    <text x="40" y="129" font-size="54" font-weight="750" letter-spacing="-1.8" fill="#f0f6fc">Build systems.</text>
    <text x="40" y="190" font-size="54" font-weight="750" letter-spacing="-1.8" fill="#64f5c4">Grow teams.</text>
    <text x="44" y="231" font-size="17" fill="#a5b8c9">前端工程 · 团队管理 · AI 实践</text>
    <path d="M44 265H530" stroke="#293b48"/>
    <text x="44" y="299" font-size="12" font-family="monospace" letter-spacing="1.2" fill="#8299ae">CODE → SYSTEMS → COLLABORATION</text>
    <text x="982" y="42" text-anchor="end" font-size="11" font-family="monospace" fill="#718b9b">LEARN / BUILD / REFINE</text>
  </g>
  <g transform="translate(813 190)">
    <circle r="119" fill="none" stroke="#2c5159"/>
    <circle r="87" fill="none" stroke="#2c5159" stroke-dasharray="3 9"/>
    <path d="M0-119 103 60H-103Z" fill="#64f5c4" fill-opacity=".025" stroke="url(#line)" stroke-opacity=".55"/>
    <path d="M0-119V0L103 60M0 0-103 60" fill="none" stroke="#396573" stroke-dasharray="4 5"/>
    <circle r="43" fill="#111f2b" stroke="#64f5c4"/>
    <text y="-2" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#f0f6fc">BUILD</text>
    <text y="17" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2" fill="#64f5c4">LEARN</text>
    <g font-family="monospace" font-size="11" text-anchor="middle" fill="#d9e9f0">
      <rect x="-68" y="-137" width="136" height="36" rx="7" fill="#12242d" stroke="#40636d"/><text y="-114">ENGINEERING</text>
      <rect x="39" y="42" width="128" height="36" rx="7" fill="#12242d" stroke="#40636d"/><text x="103" y="65">LEADERSHIP</text>
      <rect x="-150" y="42" width="94" height="36" rx="7" fill="#14302e" stroke="#64f5c4"/><text x="-103" y="65" fill="#64f5c4">AI</text>
    </g>
    <circle cx="-112" cy="-41" r="4" fill="#64f5c4"/>
    <circle cx="62" cy="102" r="3" fill="#73bfff"/>
  </g>
</svg>
